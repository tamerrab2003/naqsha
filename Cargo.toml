[package]
name = "naqsha"
version = "0.1.1"
edition = "2021"
description = "Native diagramming and architecture: flowcharts, cloud and solution architecture, CI/CD pipelines, Visio and draw.io files"
license = "MIT"
authors = ["Nixpx LLC"]
homepage = "https://nixpx.com/naqsha"
repository = "https://github.com/tamerrab2003/naqsha"
readme = "README.md"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }
resvg = "0.45"
earcutr = "0.5"
gif = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
svg2pdf = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
flate2 = "1"
yaml-rust2 = "0.10"
# Arabic and other right-to-left text on the canvas (also used by resvg)
unicode-bidi = "0.3"
unicode-bidi-mirroring = "0.4"
# the interface language follows the system unless chosen in View › Language
sys-locale = "0.3"

# Naqsha Pro (desktop and browser): Excel schedules and product lists, multi-sheet PDF sets
rust_xlsxwriter = { version = "0.99", optional = true }
pdf-writer = { version = "0.12", optional = true }
calamine = { version = "0.36", optional = true, default-features = false }

# desktop (macOS, Windows, Linux)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["x11", "wayland", "links"] }
winit = "0.30"
# Naqsha Pro checks licences with the store (official builds only)
ureq = { version = "3", optional = true, default-features = false, features = ["rustls"] }

[features]
# Naqsha Pro: needs the private pro/ module (git submodule); official builds turn this on
pro = ["dep:ureq", "dep:rust_xlsxwriter", "dep:pdf-writer", "dep:calamine"]

# the browser version (nixpx.com/naqsha/app)
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Storage", "Location", "UrlSearchParams", "BeforeUnloadEvent", "Event", "Navigator", "Request", "RequestInit", "Headers", "Response", "MessageEvent", "EventTarget"] }
log = "0.4"
# Naqsha Pro in the browser: Excel files take their timestamp from JavaScript
rust_xlsxwriter = { version = "0.99", optional = true, features = ["wasm"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
debug = "line-tables-only"

# smaller, faster browser build: cargo build --profile web --target wasm32-unknown-unknown
[profile.web]
inherits = "release"
debug = false
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# ---- Linux packages (cargo deb --no-build / cargo generate-rpm) ----
# The binary loads X11, Wayland and OpenGL at run time, so these are runtime dependencies only.
[package.metadata.deb]
maintainer = "Nixpx LLC <hello@nixpx.com>"
section = "graphics"
priority = "optional"
depends = "libc6 (>= 2.28), libgl1, libegl1, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libxcursor1, libxrandr2, libxi6, libwayland-client0"
recommends = "xdg-desktop-portal"
extended-description = "Naqsha draws flowcharts, cloud and solution architecture, C4 models and CI/CD pipelines. It opens and saves Visio .vsdx, draw.io and SVG files and exports PNG, SVG and PDF."
assets = [
    ["target/release/naqsha", "usr/bin/", "755"],
    ["linux/com.nixpx.naqsha.desktop", "usr/share/applications/", "644"],
    ["linux/naqsha-mime.xml", "usr/share/mime/packages/naqsha.xml", "644"],
    ["assets/icon.svg", "usr/share/icons/hicolor/scalable/apps/naqsha.svg", "644"],
    ["linux/naqsha-128.png", "usr/share/icons/hicolor/128x128/apps/naqsha.png", "644"],
    ["linux/naqsha-256.png", "usr/share/icons/hicolor/256x256/apps/naqsha.png", "644"],
    ["assets/icon-512.png", "usr/share/icons/hicolor/512x512/apps/naqsha.png", "644"],
    ["LICENSE", "usr/share/doc/naqsha/", "644"],
]

[package.metadata.generate-rpm]
summary = "Native diagramming and architecture app; opens Visio and draw.io files"
assets = [
    { source = "target/release/naqsha", dest = "/usr/bin/naqsha", mode = "755" },
    { source = "linux/com.nixpx.naqsha.desktop", dest = "/usr/share/applications/com.nixpx.naqsha.desktop", mode = "644" },
    { source = "linux/naqsha-mime.xml", dest = "/usr/share/mime/packages/naqsha.xml", mode = "644" },
    { source = "assets/icon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/naqsha.svg", mode = "644" },
    { source = "linux/naqsha-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/naqsha.png", mode = "644" },
    { source = "linux/naqsha-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/naqsha.png", mode = "644" },
    { source = "assets/icon-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/naqsha.png", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/naqsha/LICENSE", doc = true, mode = "644" },
]
[package.metadata.generate-rpm.requires]
mesa-libGL = "*"
mesa-libEGL = "*"
libxkbcommon = "*"
libxkbcommon-x11 = "*"
libX11 = "*"
libXcursor = "*"
libXrandr = "*"
libXi = "*"
libwayland-client = "*"

# usvg 0.45 with one fix: a glyph cluster advances by all its glyphs, so Hindi (and other
# Indic text) isn't overlapped in PNG and PDF exports. See vendor/README.md.
[patch.crates-io]
usvg = { path = "vendor/usvg" }
