[package]
name = "naqsha"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
egui = "0.36"
winit = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }
resvg = "0.45"
earcutr = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
svg2pdf = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
flate2 = "1"
yaml-rust2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[profile.release]
debug = "line-tables-only"
