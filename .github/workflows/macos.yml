name: macOS build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: ./build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Naqsha-macOS
          path: dist/*.dmg
