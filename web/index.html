<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- resolve the files next to this page whether the URL ends in "/" or not (/naqsha/app or /naqsha/app/) -->
  <script>document.write('<base href="' + location.pathname.replace(/\/?$/, '/').replace(/index\.html\/$/, '') + '">');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Naqsha — diagram editor</title>
  <meta name="description" content="Naqsha in your browser: flowcharts, cloud and solution architecture, CI/CD pipelines. Opens Visio and draw.io files.">
  <!-- the editor itself isn't a page to index; the product page is -->
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://nixpx.com/naqsha">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0F0F1A">
  <style>
    :root { --bg: #F6F5FB; --fg: #1B1830; --muted: #6B6880; --accent: #6C4DFF; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0F0F1A; --fg: #ECEAF6; --muted: #9C99B3; } }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); }
    /* eframe sizes the canvas to its parent */
    #naqsha_canvas { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; touch-action: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--muted); text-align: center; padding: 16px; }
    #loading img { width: 72px; height: 72px; animation: pulse 1.6s ease-in-out infinite; }
    #loading strong { color: var(--fg); font-size: 18px; }
    #loading a { color: var(--accent); }
    @keyframes pulse { 50% { opacity: .55; transform: scale(.94); } }
    @media (prefers-reduced-motion: reduce) { #loading img { animation: none; } }
  </style>
</head>
<body>
  <canvas id="naqsha_canvas"></canvas>
  <div id="loading">
    <img src="icon.svg" alt="">
    <strong>Naqsha</strong>
    <span>Loading the editor…</span>
    <noscript><p>Naqsha needs JavaScript. You can also <a href="https://nixpx.com/naqsha">download the desktop app</a>.</p></noscript>
  </div>
  <script type="module">
    import init from "./naqsha.js?v=__VERSION__";
    init({ module_or_path: "./naqsha_bg.wasm?v=__VERSION__" }).catch((e) => {
      console.error(e);
      document.getElementById("loading").innerHTML =
        '<p>Naqsha couldn’t start in this browser.</p><p>Try a current Chrome, Edge, Firefox or Safari, or <a href="https://nixpx.com/naqsha">download the desktop app</a>.</p>';
    });
  </script>
</body>
</html>
